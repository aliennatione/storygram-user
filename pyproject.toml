[project]
name = "storygram"
version = "0.1.0"
description = "Local-first versionable archive for episodes, sources, people, places, events, relationships, assertions, conflicts and narratives."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Storygram"}]
dependencies = [
  "pydantic>=2.9.0",
  "jsonschema>=4.23.0",
  "pyyaml>=6.0.2",
  "click>=8.1.7",
  "rich>=13.9.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "types-PyYAML",
]

[project.scripts]
storygram = "storygram.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storygram"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
